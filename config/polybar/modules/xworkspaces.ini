[module/xworkspaces]
type = internal/xworkspaces

; Usa el label de Qtile (nombre del grupo)
label-active = %name%
label-occupied = %name%
label-urgent = %name%
label-empty = %name%

; === ESTADOS ===
label-active-background = ${colors.background-alt}
label-active-foreground = ${colors.primary}
label-active-underline = ${colors.primary}
label-active-padding = 1
label-active-margin = 1 2 1 2

label-occupied-padding = 1
label-occupied-margin = 1 2 1 2

label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-urgent-margin = 1 2 1 2

label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 1
label-empty-margin = 1 2 1 2

; === COMPORTAMIENTO ===
enable-click = true
enable-scroll = false
click-right = notify-send "Workspaces" "1\n2\n3\n4\n5\n6"