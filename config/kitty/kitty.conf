# =========================
# Kitty - Kali Red Hack
# =========================

# Colores dinámicos (tema)
include colors.conf

font_size        13.0
background_opacity 0.8
# linux_display_server wayland  # comentado para que funcione tanto en X11 como Wayland

enable_audio_bell no
confirm_os_window_close 0

shell zsh

# Clipboard
copy_on_select yes
mouse_map right press ungrabbed paste_from_clipboard
mouse_map right press grabbed paste_from_clipboard
clipboard_control write-clipboard write-primary
# ctrl+v no viene mapeado a paste por defecto en kitty (solo ctrl+shift+v) —
# lo agregamos porque es el atajo esperado por costumbre, sobre todo en TUIs
# tipo TUIs donde hay que pegar contraseñas.
map ctrl+v paste_from_clipboard

# Tabs — colores dinámicos vía colors.conf (arriba); NO redeclarar acá,
# kitty usa la última definición y pisaría en silencio lo que genera
# theme-switch.sh (bug real detectado: esto pasaba antes de este cambio).
tab_bar_style powerline
tab_powerline_style slanted

# Splits
enabled_layouts tall,stack,fat,grid

# ==============================
# Custom keybindings
# ==============================

# Tabs
map ctrl+shift+n set_tab_title
map ctrl+shift+enter new_window
map ctrl+shift+w close_tab

#splits
# map ctrl+shift+enter new_window
map ctrl+shift+space new_tab
# map ctrl+shift+h new_window

# Resize splits
map ctrl+shift+left  resize_window narrower 5
map ctrl+shift+right resize_window wider 5
map ctrl+shift+up    resize_window taller 5
map ctrl+shift+down  resize_window shorter 5

#focus splits
# map ctrl+shift+j next_window
# map ctrl+shift+k previous_window
