# Preset de animaciones "snappy" — Rápido, sin rebote.
# Lo elige el campo `animations` del tema (Settings → Appearance → Motion);
# theme.conf lo incluye y agrega la animación del borde (borderangle).
animations {
    enabled = true

    bezier = snap, 0.2, 1.0, 0.3, 1.0
    bezier = winOut, 0.0, 0.0, 0.2, 1.0
    bezier = liner, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 3, snap, slide
    animation = windowsIn, 1, 3, snap, slide
    animation = windowsOut, 1, 2, winOut, slide
    animation = fade, 1, 2, liner
    animation = border, 1, 5, liner
    animation = workspaces, 1, 2, snap, slide
}
