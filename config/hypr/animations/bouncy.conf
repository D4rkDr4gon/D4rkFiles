# Preset de animaciones "bouncy" — Rebote marcado + popin.
# Lo elige el campo `animations` del tema (Settings → Appearance → Motion);
# theme.conf lo incluye y agrega la animación del borde (borderangle).
animations {
    enabled = true

    bezier = overshot, 0.34, 1.56, 0.64, 1.0
    bezier = wind, 0.05, 0.9, 0.1, 1.15
    bezier = winOut, 0.0, 0.0, 0.2, 1.0
    bezier = liner, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 6, overshot, popin 80%
    animation = windowsIn, 1, 6, overshot, popin 80%
    animation = windowsOut, 1, 5, winOut, popin 80%
    animation = fade, 1, 3, liner
    animation = border, 1, 10, liner
    animation = workspaces, 1, 5, wind, slide
}
