# =============================================================================
# Hyprland — configuración base
# Mismos keybindings y comportamiento que la config de Qtile (Wayland).
#
# Nada de acá depende del usuario o la máquina:
#   env.conf    (generado)  terminal/navegador/teclado, desde ~/.config/dotfiles/user.conf
#   theme.conf  (generado)  bordes, rounding, opacidad y blur del tema activo
#   ~/.config/dotfiles/hypr/*.conf   tus overrides (monitores, atajos propios, etc.)
# =============================================================================

# Ruta estable al repo (symlink creado por install.sh, sin importar dónde lo clonaste).
$dotfiles = $HOME/.local/share/dotfiles

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/theme.conf

# -----------------------------------------------------------------------------
# MONITOR — autodetección (resolución preferida, posición automática, escala 1).
# Para un layout propio (varios monitores, escala, refresh) creá un archivo en
# ~/.config/dotfiles/hypr/monitors.conf; `hyprctl monitors` lista los nombres.
# -----------------------------------------------------------------------------
monitor=,preferred,auto,1

# -----------------------------------------------------------------------------
# EXEC ONCE — Autostart (equivalente a hooks.py)
# -----------------------------------------------------------------------------
exec-once = waybar
exec-once = dunst
exec-once = swayosd-server                          # OSD de volumen/brillo (estilo: swayosd/style.css, tematizado por theme-switch.sh)
exec-once = wl-paste --type text  --watch $dotfiles/scripts/cliphist.sh store   # historial de portapapeles (texto)
exec-once = wl-paste --type image --watch $dotfiles/scripts/cliphist.sh store   # historial de portapapeles (imágenes)
exec-once = [ -x /usr/lib/fprintd ] && $dotfiles/config/fprint-osd/fprint-osd.py # OSD de huella (solo si fprintd está instalado)
exec-once = $dotfiles/config/hypr/scripts/start-hyprpaper.sh
exec-once = $dotfiles/scripts/welcome.sh         # notify-send de bienvenida
exec-once = systemctl --user start hyprland-session-init.service # Activar graphical-session.target para portal
exec-once = command -v kdeconnectd >/dev/null && kdeconnectd   # KDE Connect (opcional)
exec-once = hyprshell run                             # overview (Mod+W / swipe 3 dedos arriba) + Alt+Tab con previews; config: config/hyprshell/config.ron

# -----------------------------------------------------------------------------
# INPUT — Teclado y touchpad
# -----------------------------------------------------------------------------
input {
    # kb_layout / kb_variant: ver env.conf (generado desde user.conf)

    follow_mouse = 1
    mouse_refocus = false

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
        scroll_factor = 0.5
    }

    sensitivity = 0
}

# -----------------------------------------------------------------------------
# GESTOS — Touchpad (Hyprland >= 0.51: `gesture = ...`, ya no existe workspace_swipe)
# -----------------------------------------------------------------------------
# 3 dedos horizontal: cambiar de workspace (sigue el dedo, como macOS/GNOME)
gesture = 3, horizontal, workspace
# 3 dedos arriba: overview de workspaces (hyprshell). Mismo IPC que Mod+W.
gesture = 3, up, dispatcher, exec, hyprshell socat '"OpenOverview"'

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3      # más fácil confirmar el cambio
    workspace_swipe_create_new = false      # no crear workspace 7+ (esquema fijo 1..6)
    workspace_swipe_forever = false         # no saltar varios workspaces de un swipe
}

# -----------------------------------------------------------------------------
# GENERAL — Bordes, gaps, cursor
# -----------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # col.active_border / col.inactive_border: ver theme.conf

    layout = dwindle
}

# -----------------------------------------------------------------------------
# CURSOR — Timeout para ocultar cursor
# -----------------------------------------------------------------------------
cursor {
    inactive_timeout = 3
}

# -----------------------------------------------------------------------------
# DECORATION — Blur, rounding, opacidad
# -----------------------------------------------------------------------------
decoration {
    # rounding y blur: ver theme.conf
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    blur {
        new_optimizations = true
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# -----------------------------------------------------------------------------
# ANIMATIONS
# -----------------------------------------------------------------------------
animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.0, 0.1, 1.0
    bezier = winOut, 0.0, 0.0, 0.2, 1.0
    bezier = liner, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = fade, 1, 3, liner
    animation = border, 1, 10, liner
    animation = borderangle, 1, 8, liner
    animation = workspaces, 1, 3, wind, slide
}

# -----------------------------------------------------------------------------
# WINDOW RULES — Reglas de flotación y opacidad (equivalente a layouts.py + hooks.py)
# -----------------------------------------------------------------------------
# Sintaxis Hyprland 0.53+ (match:class/match:title como props, float on/tile on como effects)
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(qt5ct)$, float on
windowrule = match:class ^(pinentry)$, float on
windowrule = match:class ^(ssh-askpass)$, float on
windowrule = match:class ^(Bitwarden)$, float on
windowrule = match:title ^(branchdialog)$, float on
windowrule = match:title ^(confirmreset)$, float on
windowrule = match:title ^(makebranch)$, float on
windowrule = match:title ^(maketag)$, float on

# Opacidad por app: ver theme.conf (depende del tema).

# Firefox siempre a pantalla completa no flotante
windowrule = match:class ^(firefox)$, tile on

# Widgets TUI flotantes (config/waybar/scripts/*-launch.sh): float + "pin"
# (visibles en todos los workspaces), como un popup en la esquina superior
# derecha. El tamaño lo pide kitty en celdas (--override en el script) para
# que calce siempre con el contenido sin importar el tamaño de fuente;
# forzar un tamaño en píxeles acá lo desalineaba/recortaba. La posición
# también la calcula el script con hyprctl, porque el "move" de windowrule
# no resuelve bien "100%-N".
windowrule = match:class ^(claude-agents)$, float on
windowrule = match:class ^(claude-agents)$, pin on

windowrule = match:class ^(cliamp)$, float on
windowrule = match:class ^(cliamp)$, pin on

windowrule = match:class ^(bluetui)$, float on
windowrule = match:class ^(bluetui)$, pin on

windowrule = match:class ^(impala)$, float on
windowrule = match:class ^(impala)$, pin on

windowrule = match:class ^(vpn-tui)$, float on
windowrule = match:class ^(vpn-tui)$, pin on

windowrule = match:class ^(shortcuts)$, float on
windowrule = match:class ^(shortcuts)$, pin on

windowrule = match:class ^(hyprmon)$, float on
windowrule = match:class ^(hyprmon)$, pin on

# Ventana del menú Update (rofi/scripts/update-menu.sh): terminal centrada,
# sin pin, porque corre tareas largas con sudo/huella.
windowrule = match:class ^(dotfiles-update)$, float on
windowrule = match:class ^(dotfiles-update)$, center on
windowrule = match:class ^(dotfiles-update)$, size 1000 620

# -----------------------------------------------------------------------------
# WORKSPACES — Mismo mapping que Qtile: workspaces 1..6 (nombres numéricos)
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# KEYBINDINGS — Replican exactamente los de Qtile (keys.py)
# -----------------------------------------------------------------------------
$mainMod = SUPER

# ===================== APLICATION SHORTCUTS =====================
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $dotfiles/config/herdr/launch.sh
bind = $mainMod, Space,  exec, rofi -show drun -theme $HOME/.config/rofi/theme-drun.rasi  # walker/elephant tiene una race condition: ver docs/components.md
bind = $mainMod, B,      exec, $browser
bind = $mainMod, F,      exec, cd /tmp && $fileManager  # cwd=/tmp: hyprfm-git ignora su theme si cwd == $HOME (bug upstream)
bind = $mainMod, K,      exec, bash $HOME/.config/waybar/scripts/shortcuts-launch.sh  # cheatsheet de shortcuts, ver + editar
bind = $mainMod, S,      exec, $editor
bind = $mainMod, V,      exec, $HOME/.config/rofi/scripts/clipboard-menu.sh  # historial de portapapeles (cliphist + rofi)

# ===================== CLOSE / WINDOW TOGGLE =====================
bind = $mainMod, Q,       killactive
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, T,       togglefloating

# ===================== MOVE WINDOW =====================
bind = $mainMod SHIFT, h,  movewindow, l
bind = $mainMod SHIFT, l,  movewindow, r
bind = $mainMod SHIFT, k,  movewindow, u
bind = $mainMod SHIFT, j,  movewindow, d

# ===================== RESIZE WINDOW =====================
bind = $mainMod CTRL, h,  resizeactive, -30 0
bind = $mainMod CTRL, l,  resizeactive, 30 0
bind = $mainMod CTRL, k,  resizeactive, 0 -30
bind = $mainMod CTRL, j,  resizeactive, 0 30

# ===================== LAYOUT =====================
bind = $mainMod, Tab,   cyclenext
bind = $mainMod, N,     layoutmsg, togglesplit  # equivalente a normalize en dwindle
# Alt+Tab: lo registra hyprshell (switcher con previews, hyprshell/config.ron)

# ===================== WORKSPACES (Qtile-like behavior) =====================
# Los scripts mueven el workspace al monitor actual antes de enfocarlo,
# replicando el comportamiento de Qtile donde mod+N trae el workspace N
# al monitor donde estás parado.
#
# move-and-focus-workspace.sh: Trae workspace N al monitor actual y lo enfoca
# move-window-to-workspace.sh:  Mueve ventana a workspace N, trae N al monitor
$SCRIPTS_DIR = $HOME/.config/hypr/scripts

bind = $mainMod, 1, exec, $SCRIPTS_DIR/move-and-focus-workspace.sh 1
bind = $mainMod, 2, exec, $SCRIPTS_DIR/move-and-focus-workspace.sh 2
bind = $mainMod, 3, exec, $SCRIPTS_DIR/move-and-focus-workspace.sh 3
bind = $mainMod, 4, exec, $SCRIPTS_DIR/move-and-focus-workspace.sh 4
bind = $mainMod, 5, exec, $SCRIPTS_DIR/move-and-focus-workspace.sh 5
bind = $mainMod, 6, exec, $SCRIPTS_DIR/move-and-focus-workspace.sh 6

bind = $mainMod SHIFT, 1, exec, $SCRIPTS_DIR/move-window-to-workspace.sh 1
bind = $mainMod SHIFT, 2, exec, $SCRIPTS_DIR/move-window-to-workspace.sh 2
bind = $mainMod SHIFT, 3, exec, $SCRIPTS_DIR/move-window-to-workspace.sh 3
bind = $mainMod SHIFT, 4, exec, $SCRIPTS_DIR/move-window-to-workspace.sh 4
bind = $mainMod SHIFT, 5, exec, $SCRIPTS_DIR/move-window-to-workspace.sh 5
bind = $mainMod SHIFT, 6, exec, $SCRIPTS_DIR/move-window-to-workspace.sh 6

bind = CTRL, Tab,      workspace, +1       # Ctrl+Tab siguiente workspace
bind = CTRL SHIFT, Tab, workspace, -1      # Ctrl+Shift+Tab anterior workspace

# ===================== SYSTEM / UTILITIES =====================
bind = $mainMod, L,     exec, $HOME/.config/rofi/scripts/action-menu.sh
bind = $mainMod SHIFT, Space, exec, $HOME/.config/rofi/scripts/settings-menu.sh
bind = $mainMod CTRL, R, exec, $dotfiles/scripts/barupdate.sh && hyprctl reload

# ===================== SCREENSHOTS =====================
bind = ,            Print, exec, $dotfiles/scripts/screenshot.sh
bind = $mainMod SHIFT, S, exec, $dotfiles/scripts/screenshot.sh

# ===================== VOLUME (OSD vía swayosd) =====================
# bindel = e (repite al mantener la tecla) + l (funciona con la pantalla bloqueada)
# bindl  = l solamente: mute/media no tiene sentido repetirlos
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle

# ===================== BRIGHTNESS (OSD vía swayosd) =====================
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness +10
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -10

# ===================== MEDIA KEYS (OSD vía swayosd) =====================
bindl = , XF86AudioPlay,  exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioNext,  exec, swayosd-client --playerctl next
bindl = , XF86AudioPrev,  exec, swayosd-client --playerctl prev

# ===================== MOUSE BINDINGS =====================
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ===================== WINDOW MANAGEMENT =====================
bind = $mainMod, M, fullscreen            # Maximizar (fullscreen pero con bordes y barra)
bind = $mainMod, minus, workspace, empty  # Ir a workspace vacío

# ===================== MONITOR NAVIGATION =====================
bind = $mainMod, period,   focusmonitor, +1    # Siguiente monitor
bind = $mainMod, comma,    focusmonitor, -1    # Monitor anterior

bind = $mainMod SHIFT, period,  movewindow, +1  # Mover ventana al sig. monitor
bind = $mainMod SHIFT, comma,   movewindow, -1  # Mover ventana al ant. monitor

# =============================================================================
# ENV — Variables de entorno
# =============================================================================
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
# WLR_NO_HARDWARE_CURSORS se agrega en env.conf cuando se detecta NVIDIA o una VM.

# NOTA: DISPLAY heredado del display manager ya se limpia con `unset DISPLAY` en
# start-hyprland.sh, ANTES de lanzar Hyprland. No forzar `env = DISPLAY,` acá:
# esto fija DISPLAY="" de forma persistente durante toda la sesión y rompe
# XWayland/apps X11 (ej. OnlyOffice), que heredan cadena vacía en vez del
# DISPLAY real (:0) que asigna XWayland al arrancar de forma lazy.

# Forzar backend Wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland

# =============================================================================
# OVERRIDES DEL USUARIO — se cargan al final, así que pisan todo lo anterior.
# Ejemplo (~/.config/dotfiles/hypr/monitors.conf):
#   monitor=eDP-1,1920x1080@60,0x0,1
#   monitor=DP-1,2560x1440@144,1920x0,1
# La globbing evita el error de Hyprland cuando el directorio está vacío.
# =============================================================================
source = ~/.config/dotfiles/hypr/*.conf
