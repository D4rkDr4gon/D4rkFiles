# netguard — privacidad de la dirección en la red. Lo instala Settings → Network security → Hardening
# en /etc/NetworkManager/conf.d/90-netguard-privacy.conf.
# MAC "stable": distinta en cada red y fija en cada una (el router de casa te sigue reconociendo, otra red no
# puede relacionarte con la anterior). Solo aplica a perfiles sin MAC propia y a partir de la próxima conexión.
# Con el backend iwd, la MAC del Wi-Fi la maneja iwd (/etc/iwd/main.conf, AddressRandomization=network).
[connection]
ethernet.cloned-mac-address=stable
wifi.cloned-mac-address=stable
# IPv6 con direcciones temporales: la dirección no se deriva de la MAC ni dura para siempre
ipv6.ip6-privacy=2

[device]
wifi.scan-rand-mac-address=yes
