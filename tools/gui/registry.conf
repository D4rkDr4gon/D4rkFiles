# registry.conf — qué herramientas tienen GUI (Quickshell) además de su TUI.
# Una línea por herramienta: clase|target IPC
#   clase        la clase de ventana con la que ya se lanza la TUI (hyprland.lua)
#   target IPC   nombre del IpcHandler en config/quickshell/shell.qml (qs ipc call <target> toggle)
# Una clase que no está acá se abre como TUI aunque el modo sea gui.
# Se agrega la línea cuando la GUI existe, no antes.
launcher|launcher
launcher-emoji|launcher-emoji
launcher-power|launcher-power
settings|settings
clipboard|sec-clipboard
shortcuts|sec-shortcuts
modes|sec-modes
webapps|sec-webapps
vpn-tui|sec-vpn
impala|sec-wifi
bluetui|sec-bluetooth
spotify-tui|exec:spotify
claude-agents|sec-agents
proton-backup|sec-backup
launcher-ws|launcher-ws
expenses|sec-expenses
